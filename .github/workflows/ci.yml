name: CI

# Both suites, because `pnpm test` only runs the node project: the rendering
# fixes are asserted in the browser project, which needs a Chromium binary that
# `pnpm install` does not fetch.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test && pnpm test:browser

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build
